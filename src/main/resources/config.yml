# ======================================================== #
#              zMDisguise by zMarkitos_                    #
# ======================================================== #
# A modern, lightweight and reliable disguise system
# for Paper servers with seamless skin integration.
#
# • Fast Skin Caching
# • BossBar & ActionBar Support
# • LuckPerms Prefix Integration
# • Placeholder Support
# • Optimized Performance
# • Fully Configurable
#
# Compatible with Paper 1.19+
# ======================================================== #

# Do not modify
config-version: 1

# Plugin language (matches files inside the langs/ folder).
# Example: 'ES' -> lang_ES.yml | 'EN' -> lang_EN.yml
language: 'EN'

# Keep the disguise after reconnecting.
keep-disguise-on-relog: true

# While disguised the player's real LuckPerms groups are detached so TAB/chat show the disguised
# rank. With this on, their effective permissions are kept (as transient nodes) so they lose nothing.
keep-permissions-while-disguised: true

# Player-targeting commands that must not find a disguised player by their fake name
# (otherwise /tp <fake name> lands on the disguised player). Namespaced forms (essentials:tp) match too.
# Players with zmdisguise.bypass are exempt.
hide-from-commands: [tp, tele, etele, teleport, eteleport, etp, tp2p, etp2p, tpo, etpo, tphere, s, etphere, tpohere, etpohere, tpa, call, ecall, etpa, tpask, etpask, tpahere, etpahere, tpaall, etpaall, tppos, etppos, tpoffline, otp, offlinetp, tpoff, etpoffline, getpos, coords, egetpos, position, eposition, whereami, ewhereami, getlocation, egetlocation, getloc, egetloc, seen, eseen, whois, ewhois, home, ehome, homes, ehomes]

chat:
  # Replace the server's chat format for disguised players with "prefix name: message".
  # Turn this off when a chat plugin (EssentialsX Chat etc.) already formats chat with the
  # LuckPerms prefix, otherwise the rank is rendered twice.
  override-format: true

# Notify players with the zmdisguise.notify permission when someone disguises.
notify-admins: true

# ======================================================== #
#                         BossBar                          #
# ======================================================== #
bossbar:
  enabled: true

  # Available placeholders:
  # {name}, {real_name}, {prefix}, {suffix}, {group}
  # Supports HEX colors: &#RRGGBB
  title: "&fDisguised as: {prefix}&#FFD700{name}"

  # Available: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: "YELLOW"

  # Available: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: "SOLID"

  # BossBar progress (0.0 - 1.0)
  progress: 1.0

  # Refresh interval in ticks (20 ticks = 1 second).
  update-interval: 20

# ======================================================== #
#                        ActionBar                         #
# ======================================================== #
actionbar:
  enabled: true

  # Supports the same placeholders as the BossBar.
  message: "&fYou are currently disguised as: {prefix}&#FFD700{name}"

  # Refresh interval in ticks (20 ticks = 1 second).
  update-interval: 20

# ======================================================== #
#                       Performance                        #
# ======================================================== #
performance:
  # Internal skin cache cleanup interval (ticks).
  skin-cache-clear-interval: 6000
